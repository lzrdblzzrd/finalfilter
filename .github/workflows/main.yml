name: сборка набора правил finalfilter

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: finalfilter-publish
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.13.19"
  SING_BOX_SHA256: "ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1"

jobs:
  build:
    name: компиляция и публикация
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: клонирование репозитория
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: инициализация чистой ветки
        run: |
          set -u

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          current_commit=$(git rev-parse HEAD)
          git checkout --orphan temp
          git rm -rfq .
          git checkout "$current_commit" -- .github/workflows

      - name: установка sing-box
        run: |
          set -u

          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          download_url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            "$download_url" \
            --output "$archive_path"

          printf '%s  %s\n' "$SING_BOX_SHA256" "$archive_path" |
            sha256sum --check -

          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: проверка версии sing-box
        run: sing-box version

      - name: загрузка и компиляция правил
        run: |
          set -u

          sources=(
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community.lst"
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/community_ips.lst"
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/discord_ips.lst"
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst"
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst"
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ooni_domains.lst"
            "https://community.antifilter.download/list/community.lst"
            "https://community.antifilter.download/list/domains.lst"
          )

          : > all_sources.txt

          for src in "${sources[@]}"; do
            source_file=$(mktemp)

            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --location \
              --retry 4 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 300 \
              "$src" \
              --output "$source_file"

            if [[ ! -s "$source_file" ]]; then
              echo "::error::источник вернул пустой файл: $src"
              rm -f "$source_file"
              exit 1
            fi

            if grep -qiE '<!doctype[[:space:]]+html|<html' "$source_file"; then
              echo "::error::источник вернул HTML вместо списка: $src"
              rm -f "$source_file"
              exit 1
            fi

            cat "$source_file" >> all_sources.txt
            printf '\n' >> all_sources.txt
            rm -f "$source_file"
          done

          python3 <<'PY'
          import ipaddress
          import re
          from pathlib import Path

          source = Path("all_sources.txt").read_text(
              encoding="utf-8",
              errors="replace",
          )

          candidate_pattern = re.compile(
              r"(?<![0-9A-Za-z_.:-])"
              r"(?:"
              r"(?:\d{1,3}\.){3}\d{1,3}"
              r"|"
              r"[0-9A-Fa-f:]*:[0-9A-Fa-f:.]+"
              r")"
              r"(?:/\d{1,3})?"
              r"(?![0-9A-Za-z_.:/-])"
          )

          ipv4 = set()
          ipv6 = set()

          for candidate in candidate_pattern.findall(source):
              try:
                  network = ipaddress.ip_network(candidate, strict=False)
              except ValueError:
                  continue

              if network.version == 4:
                  ipv4.add(network)
              else:
                  ipv6.add(network)

          networks = [
              *ipaddress.collapse_addresses(ipv4),
              *ipaddress.collapse_addresses(ipv6),
          ]

          with Path("ips.txt").open(
              "w",
              encoding="utf-8",
              newline="\n",
          ) as output:
              for network in networks:
                  output.write(f"{network}\n")
          PY

          grep -oP \
            '^(?:\x{FEFF})?\s*(?:[\x22\x27])?(?:@@\|\||\|\|)?(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3}|::1)?\s*(?:[a-zA-Z]+://)?(?:[^@/\s]+@)?\K(?:[a-zA-Z0-9\p{L}](?:[a-zA-Z0-9\p{L}-]{0,61}[a-zA-Z0-9\p{L}])?\.)+[a-zA-Z\p{L}][a-zA-Z0-9\p{L}-]{0,61}[a-zA-Z0-9\p{L}](?=[/;:?#\^$\s,]|\x22|\x27|$)' \
            all_sources.txt |
            awk '{ print tolower($0) }' |
            sed -E 's/^(www\.)+//' |
            sort -u > domains.txt

          ip_count=$(wc -l < ips.txt)
          domain_count=$(wc -l < domains.txt)

          if (( ip_count < 1000 )); then
            echo "::error::подозрительно мало IP-адресов и подсетей: $ip_count"
            exit 1
          fi

          if (( domain_count < 10000 )); then
            echo "::error::подозрительно мало доменов: $domain_count"
            exit 1
          fi

          jq -Rn '[inputs | select(length > 0)]' < ips.txt > ips.json
          jq -Rn '[inputs | select(length > 0)]' < domains.txt > domains.json

          jq -n \
            --slurpfile ips ips.json \
            --slurpfile domains domains.json \
            '{
              version: 1,
              rules: [
                {
                  ip_cidr: $ips[0],
                  domain_suffix: $domains[0]
                }
              ]
            }' > finalfilter.json

          sing-box rule-set compile finalfilter.json -o finalfilter.srs

          if [[ ! -s finalfilter.srs ]]; then
            echo "::error::finalfilter.srs отсутствует или пуст"
            exit 1
          fi

          {
            echo '# использование в sing-box'
            echo '```json'
            echo '{'
            echo '  "route": {'
            echo '    "rules": ['
            echo '      {'
            echo '        "rule_set": "finalfilter",'
            echo '        "action": "route",'
            echo '        "outbound": "proxy"'
            echo '      }'
            echo '    ],'
            echo '    "rule_set": ['
            echo '      {'
            echo '        "type": "remote",'
            echo '        "tag": "finalfilter",'
            echo '        "format": "binary",'
            echo '        "url": "https://raw.githubusercontent.com/${{ github.repository }}/main/finalfilter.srs"'
            echo '      }'
            echo '    ]'
            echo '  }'
            echo '}'
            echo '```'
            echo ''
            echo '## статистика'
            echo "- **дата последнего обновления:** $(TZ='Europe/Moscow' date +'%d.%m.%Y %H:%M')"
            echo "- **ip-адреса и подсети:** $ip_count"
            echo "- **домены:** $domain_count"
            echo ''
            echo '## источники'

            for src in "${sources[@]}"; do
              echo "- $src"
            done
          } > readme.md

      - name: публикация набора правил
        run: |
          set -u

          git add readme.md finalfilter.srs .github/workflows
          git commit -m "$(TZ='Europe/Moscow' date +'%d.%m.%Y %H:%M')"
          git push --force origin temp:main

  cleanup:
    name: удаление старых запусков workflow
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: none
      actions: write

    defaults:
      run:
        shell: bash

    steps:
      - name: удаление старых запусков workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -u

          runs_file=$(mktemp)
          trap 'rm -f "$runs_file"' EXIT

          gh api \
            --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' \
            > "$runs_file"

          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" != "$CURRENT_RUN_ID" ]] || continue

            gh api \
              --method DELETE \
              "repos/$GH_REPO/actions/runs/$run_id"
          done < "$runs_file"
